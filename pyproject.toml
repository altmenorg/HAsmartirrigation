[tool.ruff]
# Home Assistant 2026.3 and up runs on Python 3.14 only.
target-version = "py314"

lint.select = [
  "E",  # pycodestyle
  "F",  # Pyflakes
  "B",  # flake‑bugbear
  "I",  # isort‑style import ordering
  "UP", # pyupgrade
  "SIM" # flake‑simplicity
]

lint.ignore = [
  "E501",  # line‑length
  "SIM102" # nested if statements
]