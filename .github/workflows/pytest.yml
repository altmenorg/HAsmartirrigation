name: Test Smart Irrigation

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Home Assistant 2026.3 onwards requires Python 3.14.2, so testing on
        # anything older tests a combination no user can install.
        python-version: ['3.14']

    steps:
      - name: Checkout Smart Irrigation
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.test.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --cov=custom_components.smart_irrigation --cov-report=xml --cov-report=term-missing --ignore-glob="**/test_*.py.disabled"

      - name: Run integration tests
        run: |
          pytest custom_components/smart_irrigation/tests/test_helpers.py custom_components/smart_irrigation/tests/test_performance.py custom_components/smart_irrigation/tests/test_diagnostics.py -v

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Smart Irrigation
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Run ruff linter
        run: ruff check custom_components/smart_irrigation/ --output-format=github

      - name: Check code formatting with black
        run: black --check custom_components/smart_irrigation/

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Smart Irrigation
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: custom_components/smart_irrigation/frontend/package-lock.json

      # The panel is thousands of lines that nothing checked until now: a break
      # in it is invisible to the Python suite and only shows up in someone's
      # browser.
      - name: Install dependencies
        working-directory: custom_components/smart_irrigation/frontend
        run: npm ci

      - name: Lint
        working-directory: custom_components/smart_irrigation/frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: custom_components/smart_irrigation/frontend
        run: npm run test

      - name: Check the committed bundle matches the sources
        working-directory: custom_components/smart_irrigation/frontend
        run: |
          npx rollup -c --bundleConfigAsCjs
          cd ../../..
          git diff --exit-code --stat -- custom_components/smart_irrigation/frontend/dist \
            || { echo "::error::The committed bundle does not match the sources. Run the build and commit dist/."; exit 1; }
