name: Test Smart Irrigation

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  # The test requirements follow the latest Home Assistant the test plugin
  # supports, so a nightly run catches a release that breaks the integration
  # the day the plugin supports it (#979). A run on the Home Assistant beta is
  # not possible: the plugin is only published for releases, and an older one
  # does not load on a newer Home Assistant.
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

# A new push stops the run of the one it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Home Assistant 2026.3 onwards requires Python 3.14.2, so testing on
        # anything older tests a combination no user can install.
        python-version: ['3.14']

    steps:
      - name: Checkout Smart Irrigation
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.test.txt

      # The floor sits just under today's coverage: it does not ask for more
      # tests, it only stops a change that takes some away.
      - name: Run the tests with coverage
        run: |
          pytest tests/ -n auto -q --cov=custom_components.smart_irrigation --cov-report=xml --cov-report=term --cov-fail-under=84

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # hacs.json promises a minimum Home Assistant version: this runs the suite on
  # that version, so the promise is one something checks.
  minimum-home-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Smart Irrigation
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install the minimum Home Assistant
        run: |
          python -m pip install --upgrade pip
          # The last patch of the minimum's month: the test plugin is published
          # for those, not for every release, and a patch only fixes bugs.
          minimum=$(python -c "import json; print(json.load(open('hacs.json'))['homeassistant'].rsplit('.', 1)[0])")
          echo "Home Assistant $minimum.*"
          pip install aiofiles "homeassistant==$minimum.*" "pytest-homeassistant-custom-component>=0.13"
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"

      - name: Run the tests
        run: pytest tests/ -n auto -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Smart Irrigation
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff linter
        run: ruff check custom_components/smart_irrigation/ tests/ scripts/ --output-format=github

      - name: Check code formatting with black
        run: black --check custom_components/smart_irrigation/ tests/ scripts/

      - name: Check every place says the same version
        run: python scripts/check_version.py

      - name: Check the links between the pages of the docs
        run: python scripts/check_links.py

  # The code predates type checking: the number of errors mypy finds is
  # recorded, and may only go down. The count depends on the Home Assistant it
  # reads the types of, so that is pinned: moving the pin means recording the
  # count it gives in scripts/mypy_baseline.txt.
  types:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      MYPY_HOME_ASSISTANT: '2026.10.4'
    steps:
      - name: Checkout Smart Irrigation
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiofiles "homeassistant==$MYPY_HOME_ASSISTANT" mypy==2.4.1

      - name: Type check against the recorded ceiling
        run: python scripts/mypy_baseline.py

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Smart Irrigation
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: custom_components/smart_irrigation/frontend/package-lock.json

      # The panel is thousands of lines that nothing checked until now: a break
      # in it is invisible to the Python suite and only shows up in someone's
      # browser.
      - name: Install dependencies
        working-directory: custom_components/smart_irrigation/frontend
        run: npm ci

      - name: Lint
        working-directory: custom_components/smart_irrigation/frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: custom_components/smart_irrigation/frontend
        run: npm run test

      - name: Check the committed bundle matches the sources
        working-directory: custom_components/smart_irrigation/frontend
        run: |
          npx rollup -c --bundleConfigAsCjs
          cd ../../..
          git diff --exit-code --stat -- custom_components/smart_irrigation/frontend/dist \
            || { echo "::error::The committed bundle does not match the sources. Run the build and commit dist/."; exit 1; }
