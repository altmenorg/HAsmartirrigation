# Dependabot keeps dependencies current and opens PRs for security fixes.
# Read more: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Frontend panel (TypeScript / Lit, built with rollup). These are build-time
  # only (compiled into the shipped bundle), so minor/patch bumps are grouped
  # into a single PR to keep the noise down.
  - package-ecosystem: "npm"
    directory: "/custom_components/smart_irrigation/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # vitest 5 needs Node 22 or newer, and the build runs on Node 20.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # eslint 10 does not install with the plugins we use yet (npm ERESOLVE).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  # Python dev / test dependencies.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Versions of the actions used in the GitHub workflows (e.g. deploy-pages).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
