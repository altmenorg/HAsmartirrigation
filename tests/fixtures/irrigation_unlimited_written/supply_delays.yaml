# Written for Smart Irrigation's import test, not one of IU's own configurations:
# none of those has a master with a lead and a delay after (preamble and
# postamble) and expected times. The results are IU's own: Irrigation Unlimited
# 2025.12.0 (commit 05a5eaa) ran this file in its test harness with
# output_events, and printed them.
default_config:

irrigation_unlimited:
  refresh_interval: 2000
  testing:
    enabled: true
    speed: 1.0
    output_events: false
    show_log: false
    autoplay: false
    times:
      - name: "1-Preamble and postamble, a zone's schedule"
        start: "2023-06-10 05:00"
        end: "2023-06-10 06:00"
        results:
          - {t: '2023-06-10 05:09:00', c: 1, z: 0, s: 1}
          - {t: '2023-06-10 05:10:00', c: 1, z: 1, s: 1}
          - {t: '2023-06-10 05:20:00', c: 1, z: 1, s: 0}
          - {t: '2023-06-10 05:22:00', c: 1, z: 0, s: 0}
      - name: "2-Preamble and postamble, a sequence"
        start: "2023-06-10 06:00"
        end: "2023-06-10 07:00"
        results:
          - {t: '2023-06-10 06:04:00', c: 1, z: 0, s: 1}
          - {t: '2023-06-10 06:05:00', c: 1, z: 1, s: 1}
          - {t: '2023-06-10 06:11:00', c: 1, z: 1, s: 0}
          - {t: '2023-06-10 06:11:00', c: 1, z: 2, s: 1}
          - {t: '2023-06-10 06:23:00', c: 1, z: 2, s: 0}
          - {t: '2023-06-10 06:25:00', c: 1, z: 0, s: 0}
      - name: "3-Preamble and postamble, a sequence with a wait between zones"
        start: "2023-06-10 07:00"
        end: "2023-06-10 08:00"
        results:
          - {t: '2023-06-10 07:04:00', c: 1, z: 0, s: 1}
          - {t: '2023-06-10 07:05:00', c: 1, z: 2, s: 1}
          - {t: '2023-06-10 07:10:00', c: 1, z: 2, s: 0}
          - {t: '2023-06-10 07:13:00', c: 1, z: 3, s: 1}
          - {t: '2023-06-10 07:21:00', c: 1, z: 3, s: 0}
          - {t: '2023-06-10 07:23:00', c: 1, z: 0, s: 0}
  controllers:
    - name: "Garden"
      entity_id: "switch.pump"
      preamble: "0:01:00"
      postamble: "0:02:00"
      zones:
        - name: "Zone 1"
          entity_id: "switch.zone_1"
          schedules:
            - time: "05:10"
              duration: "0:10:00"
        - name: "Zone 2"
          entity_id: "switch.zone_2"
        - name: "Zone 3"
          entity_id: "switch.zone_3"
      sequences:
        - name: "Sequence 1"
          schedules:
            - time: "06:05"
          zones:
            - zone_id: 1
              duration: "0:06:00"
            - zone_id: 2
              duration: "0:12:00"
        - name: "Sequence 2"
          delay: "0:03:00"
          schedules:
            - time: "07:05"
          zones:
            - zone_id: 2
              duration: "0:05:00"
            - zone_id: 3
              duration: "0:08:00"
