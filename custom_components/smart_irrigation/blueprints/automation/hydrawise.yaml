blueprint:
  name: Smart Irrigation with Hunter Hydrawise
  description: >-
    Waters one Smart Irrigation zone on a Hunter Hydrawise zone, for the duration Smart
    Irrigation calculated, when irrigation starts. Turn off Hunter Hydrawise's own
    schedule for that zone, or it will water on top of this. The run is
    rounded up to what Hunter Hydrawise accepts. Create one automation per zone.
    Not yet confirmed on real Hunter Hydrawise hardware: feedback is welcome on the
    Smart Irrigation discussions.
  domain: automation
  source_url: https://github.com/altmenorg/HAsmartirrigation/blob/master/custom_components/smart_irrigation/blueprints/automation/hydrawise.yaml
  input:
    irrigation_zone:
      name: Smart Irrigation zone
      description: The zone's duration sensor.
      selector:
        entity:
          filter:
            - integration: smart_irrigation
              device_class: duration
    controller_zone:
      name: Hunter Hydrawise zone
      description: The Hunter Hydrawise zone that waters it.
      selector:
        entity:
          filter:
            - integration: hydrawise
              domain: binary_sensor
    reset_bucket:
      name: Reset the bucket after the run
      description: >-
        Leave on unless observed watering already credits this zone from the
        Hunter Hydrawise zone's own on and off, which would count the run twice.
      default: true
      selector:
        boolean:

variables:
  duration_entity: !input irrigation_zone
  reset_after: !input reset_bucket
  # The run in whole minutes, rounded up so no deficit is left, at least 1
  # and no more than the controller accepts (1440 minutes).
  amount: >-
    {{ [[((states(duration_entity) | float(0)) / 60) | round(0, 'ceil') | int, 1] | max, 1440] | min }}

triggers:
  - trigger: event
    event_type: smart_irrigation_start_irrigation_all_zones

conditions:
  - condition: numeric_state
    entity_id: !input irrigation_zone
    above: 0

actions:
  - action: hydrawise.start_watering
    target:
      entity_id: !input controller_zone
    data:
      duration: "{{ amount }}"
  - delay:
      minutes: "{{ amount | int }}"
  - if:
      - condition: template
        value_template: "{{ reset_after }}"
    then:
      - action: smart_irrigation.reset_bucket
        target:
          entity_id: !input irrigation_zone

mode: single
