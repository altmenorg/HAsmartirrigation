blueprint:
  name: Smart Irrigation
  description: Smart irrigation for a zone
  domain: automation
  input:
    irrigation_switch:
      name: Irrigation Switch
      description: Switch, tap or valve to turn on and off
      selector:
        entity:
          filter:
            - domain: switch
            - domain: input_boolean
            - domain: valve

    pause_switch:
      name: Pause Switch
      description: Switch, if off don't run automation
      selector:
        entity:
          filter:
            - domain: input_boolean            

    irrigation_zone:
      name: Irrigation Zone
      description: Zone to irrigate
      selector:
        entity:
          filter:
            # Narrow to this integration: a bare duration filter offers every
            # duration sensor in the house.
            - integration: smart_irrigation
              device_class: duration

variables:
  duration: !input irrigation_zone

alias: Standard Irrigation
description: "Standard irrigation for a Zone"

triggers:
  trigger: event
  event_type: smart_irrigation_start_irrigation_all_zones

conditions:
  - condition: numeric_state
    entity_id: !input irrigation_zone
    above: 0
  - condition: state
    entity_id: !input pause_switch
    state: "on"    

actions:
  - action: homeassistant.turn_on
    data: {}
    target:
      entity_id: !input irrigation_switch

  - variables:
      run_seconds: "{{ states(duration) | float(0) }}"

  - delay: "{{ run_seconds }}"

  - action: homeassistant.turn_off
    data: {}
    target:
      entity_id:
        - !input irrigation_switch

  # The water the run delivered, not a reset to 0: a run cut short by the
  # zone's maximum duration keeps the deficit it did not water.
  - action: smart_irrigation.credit_watering
    data:
      seconds: "{{ run_seconds }}"
    target:
      entity_id: !input irrigation_zone

mode: single
