blueprint:
  name: Irrigation Unlimited adjust watering time for one zone of a sequence.
  description: >-
    Hand Irrigation Unlimited the duration Smart Irrigation calculated for one
    zone inside a sequence.

    Adjusting a sequence as a whole spreads the time you give it across every
    zone in it, in proportion to their original durations: three zones of 10,
    20 and 30 minutes told to run 30 minutes become 5, 10 and 15. That is not
    what a calculated duration means, since each zone has its own need. So this
    adjusts one zone of the sequence, and you add one automation per zone.
  domain: automation
  input:
    irrigation_zone:
      name: Smart Irrigation zone
      description: The zone whose calculated duration should be used.
      selector:
        entity:
          filter:
            # Narrow to this integration: a bare duration filter offers every
            # duration sensor in the house.
            - integration: smart_irrigation
              device_class: duration

    unlimited_sequence:
      name: Irrigation Unlimited controller
      description: The controller entity that holds the sequence.
      selector:
        entity:
          filter:
            - domain: binary_sensor

    unlimited_sequence_id:
      name: Sequence number
      description: >-
        Which sequence of that controller, numbered from 1 as Irrigation
        Unlimited numbers them.
      selector:
        number:
          max: 100
          min: 1
          mode: box

    unlimited_zone_ref:
      name: Zone number inside the sequence
      description: >-
        Which zone of that sequence this Smart Irrigation zone feeds, numbered
        from 1 in the order the sequence lists them.
      selector:
        number:
          max: 100
          min: 1
          mode: box

    time_on:
      name: Time to adjust
      description: >-
        After Smart Irrigation has calculated, and before Irrigation Unlimited
        starts. The default sits between the usual 11 PM calculation and a
        run at dawn.
      selector:
        time:
      default: "23:30:00"

variables:
  duration: !input irrigation_zone

alias: Smart Irrigation adjustment

trigger:
  platform: time
  at: !input time_on

condition:
  # `duration` holds the entity id of the Smart Irrigation zone, so it has to
  # reach states() unquoted. Quoting it looked up an entity literally named
  # "duration", which does not exist: the condition never passed, and had it
  # passed the adjustment would have been sent as zero seconds.
  - condition: template
    value_template: "{{ (states(duration) | float(-1)) >= 0 }}"

action:
  - service: irrigation_unlimited.adjust_time
    data:
      actual: "{{ timedelta(seconds=states(duration) | int(0)) }}"
      entity_id: !input unlimited_sequence
      sequence_id: !input unlimited_sequence_id
      # Without this the time would be spread over the whole sequence.
      zones: !input unlimited_zone_ref

mode: single
