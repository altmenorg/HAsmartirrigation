calculate_all_zones:
  name: Calculate all zones
  description: Calculate irrigation requirements for all zones.
  fields:
    delete_weather_data:
        required: false
        example: false
        default: true
        selector:
          boolean: {}
    dry_run:
        required: false
        example: true
        default: false
        selector:
          boolean: {}
calculate_zone:
  name: Calculate zone
  description: Calculate irrigation requirements for a specific zone.
  target:
    entity:
      domain: sensor
  fields:
    delete_weather_data:
        required: false
        example: false
        default: true
        selector:
          boolean: {}
    dry_run:
        required: false
        example: true
        default: false
        selector:
          boolean: {}
update_all_zones:
  name: Update all zones
  description: Update irrigation settings for all zones.
update_zone:
  name: Update zone
  description: Update irrigation settings for a specific zone.
  target:
    entity:
      domain: sensor
set_bucket:
  name: Set bucket
  description: Set the water bucket value for a specific zone.
  target:
    entity:
      domain: sensor
  fields:
    new_bucket_value:
      required: true
      example: -10
      default: 0
set_all_buckets:
  name: Set all buckets
  description: Set the water bucket value for all zones.
  fields:
    new_bucket_value:
      required: true
      example: -10
      default: 0
reset_bucket:
  name: Reset bucket
  description: Reset the water bucket value for a specific zone.
  target:
    entity:
      domain: sensor
credit_watering:
  name: Credit watering
  description: >-
    Credit a zone's bucket with the water a run actually delivered, instead of
    setting it to 0. Call it at the end of your own irrigation automation.
  target:
    entity:
      domain: sensor
  fields:
    seconds:
      required: false
      example: 900
      description: "How long the zone ran, in seconds. Empty: the zone's duration."
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
run_program:
  name: Run program
  description: >-
    Run a program of the full controller now, or as soon as it is its turn when
    another one is running. The program waters its zones with the durations
    Smart Irrigation calculated, unless its steps say otherwise.
  fields:
    program_id:
      name: Program
      required: true
      example: evening
      description: The id of the program, as shown in its settings.
      selector:
        text:
    seconds:
      name: Seconds
      required: false
      example: 1800
      description: >-
        A total duration for the whole program, shared between its steps in
        proportion to their planned durations. Left empty, the planned
        durations.
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
    mode:
      name: Mode
      required: false
      default: queue
      description: >-
        What to do when something is already watering. Queue takes the turn
        behind it; replace stops it cleanly first.
      selector:
        select:
          options:
            - queue
            - replace
stop_program:
  name: Stop program
  description: >-
    Stop one program. If it is running, its open zones are closed the normal
    way and credited for what they delivered; if it is waiting for its turn, it
    is taken out of the queue. An unknown program does nothing. The main
    program is stopped with stop_watering.
  fields:
    program_id:
      name: Program
      required: true
      example: evening
      description: The id of the program.
      selector:
        text:
set_program_enabled:
  name: Enable or disable a program
  description: >-
    Switch a program of the full controller on or off, as the switch in its
    settings does.
  fields:
    program_id:
      name: Program
      required: true
      example: evening
      description: The id of the program.
      selector:
        text:
    enabled:
      name: Enabled
      required: true
      default: true
      description: On to enable it, off to disable it.
      selector:
        boolean:
set_step_enabled:
  name: Enable or disable a step
  description: Switch one step of a program on or off.
  fields:
    program_id:
      name: Program
      required: true
      example: evening
      description: The id of the program.
      selector:
        text:
    step_id:
      name: Step
      required: true
      example: step_1
      description: The id of the step, as shown in the program.
      selector:
        text:
    enabled:
      name: Enabled
      required: true
      default: true
      description: On to enable it, off to disable it.
      selector:
        boolean:
set_schedule_enabled:
  name: Enable or disable a schedule
  description: >-
    Switch one schedule of a program on or off. The schedules are armed again
    at once.
  fields:
    program_id:
      name: Program
      required: true
      example: evening
      description: The id of the program.
      selector:
        text:
    schedule_id:
      name: Schedule
      required: true
      example: schedule_1
      description: The id of the schedule, as shown in the program.
      selector:
        text:
    enabled:
      name: Enabled
      required: true
      default: true
      description: On to enable it, off to disable it.
      selector:
        boolean:
stop_watering:
  name: Stop watering
  description: >-
    Stop the watering now. Every valve Smart Irrigation opened is closed, each
    zone is credited for the water it delivered, and the programs and the zones
    still waiting are ended. With zones chosen, only those are stopped.
  target:
    entity:
      domain: sensor
pause_watering:
  name: Pause watering
  description: >-
    Close the open valves and hold the watering, the zones still waiting
    included. What was delivered is credited, and after the resume the rest of
    the pass is watered. A pause that is not lifted ends by itself.
  fields:
    minutes:
      name: Minutes
      description: The longest the pause lasts before it lifts itself.
      required: false
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
resume_watering:
  name: Resume watering
  description: Go on with a paused watering from where it stopped.
next_step:
  name: Next step
  description: >-
    End the zones of the step a program is on and go on to the next step.
suspend:
  name: Suspend
  description: >-
    Keep a zone or a program from watering until a moment. With no duration and
    no date, or zero hours, the suspension is lifted.
  target:
    entity:
      domain: sensor
  fields:
    program_id:
      name: Program
      description: The id of a program to suspend.
      required: false
      selector:
        text:
    hours:
      name: Hours
      description: How long to suspend for. Zero lifts it.
      required: false
      example: 48
      selector:
        number:
          min: 0
          max: 8760
          unit_of_measurement: h
    until:
      name: Until
      description: The moment the suspension ends.
      required: false
      selector:
        datetime:
adjust_program:
  name: Adjust a program
  description: >-
    Make a program of the full controller water longer or shorter, for a
    while. The adjustment replaces the previous one (it never adds up), applies
    to the runs that start after it is set, and ends after the hours given.
  fields:
    program_id:
      name: Program
      description: The id of the program to adjust.
      required: true
      selector:
        text:
    percent:
      name: Percent
      description: Multiplies the water of each step (120 waters 20 % longer).
      required: false
      example: 120
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: "%"
    seconds:
      name: Seconds
      description: Seconds of water added to each step (negative to take off).
      required: false
      example: 30
      selector:
        number:
          min: -21600
          max: 21600
          unit_of_measurement: s
    hours:
      name: Hours
      description: How long the adjustment lasts. Left empty, until it is reset.
      required: false
      example: 48
      selector:
        number:
          min: 1
          max: 8760
          unit_of_measurement: h
    reset:
      name: Reset
      description: Remove the adjustment of this program.
      required: false
      default: false
      selector:
        boolean:
water_zone:
  name: Water a zone
  description: >-
    Water a zone now, or as soon as it is its turn when something is watering.
    Without a duration, the zone waters for the duration Smart Irrigation
    calculated.
  target:
    entity:
      domain: sensor
  fields:
    seconds:
      name: Seconds
      description: Seconds of water. Left empty, the calculated duration.
      required: false
      example: 600
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
    mode:
      name: Mode
      required: false
      default: queue
      description: >-
        What to do when something is already watering. Queue takes the turn
        behind it; replace stops it cleanly first.
      selector:
        select:
          options:
            - queue
            - replace
use_measured_throughput:
  name: Use the measured throughput
  description: >-
    Set a zone's throughput to the flow its meter measured over its runs. The
    measurement is only ever advice; this is how to accept it.
  target:
    entity:
      domain: sensor
  fields:
    zone_id:
      name: Zone id
      description: The id of the zone, instead of its entity.
      required: false
      selector:
        number:
          min: 0
          max: 999
          mode: box
reset_all_buckets:
  name: Reset all buckets
  description: Reset the water bucket value for all zones.
set_all_multipliers:
  name: Set all multipliers
  description: Set the irrigation multiplier value for all zones.
  fields:
    new_multiplier_value:
      required: true
      example: 1.0
      default: 1.0
set_multiplier:
  name: Set multiplier
  description: Set the irrigation multiplier value for a specific zone.
  target:
    entity:
      domain: sensor
  fields:
    new_multiplier_value:
      required: true
      example: 1.0
      default: 1.0
set_zone:
  name: Set zone
  description: Set irrigation parameters for a specific zone.
  target:
    entity:
      domain: sensor
  fields:
    new_bucket_value:
      required: false
      example: -10
      default: 0
    new_multiplier_value:
      required: false
      example: 1.0
      default: 1.0
    new_duration_value:
      required: false
      example: 10
      default: 0
    new_state_value:
      required: false
      example: "automatic"
      default: "automatic"
    new_throughput_value:
      required: false
      example: 50
      default: 50
clear_all_weather_data:
  name: Clear weather data
  description: >-
    Clear the collected weather data of every sensor group, or, when you pick
    zones, of their sensor groups only. The weather data is shared by the zones
    of a group, so the other zones of those groups lose it too.
  target:
    entity:
      domain: sensor
generate_watering_calendar:
  name: Generate watering calendar
  description: Generate a 12-month watering calendar for irrigation zones based on representative climate data.
  target:
    entity:
      domain: sensor

# Enhanced Scheduling Services
create_recurring_schedule:
  name: Create recurring schedule
  description: Create a new recurring irrigation schedule.
  fields:
    name:
      required: true
      example: "Morning Watering"
      description: "Name of the schedule"
      selector:
        text:
    type:
      required: true
      example: "daily"
      description: "Schedule type (daily, weekly, monthly, interval)"
      selector:
        select:
          options:
            - "daily"
            - "weekly"
            - "monthly"
            - "interval"
    enabled:
      required: false
      example: true
      default: true
      description: "Enable the schedule"
      selector:
        boolean:
    time:
      required: false
      example: "06:00"
      description: "Time to run (HH:MM format)"
      selector:
        time:
    days_of_week:
      required: false
      example: ["monday", "wednesday", "friday"]
      description: "Days of week for weekly schedules"
      selector:
        select:
          options:
            - "monday"
            - "tuesday"
            - "wednesday"
            - "thursday"
            - "friday"
            - "saturday"
            - "sunday"
          multiple: true
    day_of_month:
      required: false
      example: 15
      description: "Day of month for monthly schedules (1-31)"
      selector:
        number:
          min: 1
          max: 31
    interval_hours:
      required: false
      example: 24
      description: "Interval in hours for interval schedules"
      selector:
        number:
          min: 1
          max: 168
    zones:
      required: false
      example: "all"
      description: "Zone IDs to include or 'all'"
      selector:
        text:
    action:
      required: false
      example: "calculate"
      default: "calculate"
      description: "Action to perform (calculate, update, irrigate)"
      selector:
        select:
          options:
            - "calculate"
            - "update"
            - "irrigate"

update_recurring_schedule:
  name: Update recurring schedule
  description: Update an existing recurring irrigation schedule.
  fields:
    schedule_id:
      required: true
      example: "schedule_abc123"
      description: "ID of the schedule to update"
      selector:
        text:
    name:
      required: false
      example: "Evening Watering"
      description: "Name of the schedule"
      selector:
        text:
    enabled:
      required: false
      example: false
      description: "Enable/disable the schedule"
      selector:
        boolean:

delete_recurring_schedule:
  name: Delete recurring schedule
  description: Delete a recurring irrigation schedule.
  fields:
    schedule_id:
      required: true
      example: "schedule_abc123"
      description: "ID of the schedule to delete"
      selector:
        text:

create_seasonal_adjustment:
  name: Create seasonal adjustment
  description: Create a new seasonal adjustment for irrigation zones.
  fields:
    name:
      required: true
      example: "Summer Boost"
      description: "Name of the adjustment"
      selector:
        text:
    enabled:
      required: false
      example: true
      default: true
      description: "Enable the adjustment"
      selector:
        boolean:
    month_start:
      required: true
      example: 6
      description: "Starting month (1-12)"
      selector:
        number:
          min: 1
          max: 12
    month_end:
      required: true
      example: 8
      description: "Ending month (1-12)"
      selector:
        number:
          min: 1
          max: 12
    multiplier_adjustment:
      required: false
      example: 1.5
      default: 1.0
      description: "Multiplier adjustment factor"
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
    threshold_adjustment:
      required: false
      example: -5.0
      default: 0.0
      description: "Threshold adjustment in mm"
      selector:
        number:
          min: -50.0
          max: 50.0
          step: 0.5
    zones:
      required: false
      example: "all"
      description: "Zone IDs to include or 'all'"
      selector:
        text:

update_seasonal_adjustment:
  name: Update seasonal adjustment
  description: Update an existing seasonal adjustment.
  fields:
    adjustment_id:
      required: true
      example: "adjustment_xyz789"
      description: "ID of the adjustment to update"
      selector:
        text:
    name:
      required: false
      example: "Winter Reduction"
      description: "Name of the adjustment"
      selector:
        text:
    enabled:
      required: false
      example: false
      description: "Enable/disable the adjustment"
      selector:
        boolean:

delete_seasonal_adjustment:
  name: Delete seasonal adjustment
  description: Delete a seasonal adjustment.
  fields:
    adjustment_id:
      required: true
      example: "adjustment_xyz789"
      description: "ID of the adjustment to delete"
      selector:
        text:

# Irrigation Unlimited Integration Services
postpone_irrigation:
  name: Postpone irrigation
  description: >-
    Hold watering back for a while, then let it resume by itself. Nothing is
    reset: a zone that is short of water still is when the postponement ends,
    and the next run makes it up.
  fields:
    hours:
      name: Hours
      description: How long to hold watering back. Zero lifts a postponement.
      required: false
      default: 24
      example: 48
      selector:
        number:
          min: 0
          max: 336
          step: 1
          unit_of_measurement: h
resume_irrigation:
  name: Resume irrigation
  description: Lift a postponement, whatever is left of it.
